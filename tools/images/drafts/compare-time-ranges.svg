<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1120" viewBox="0 0 1800 1120" role="img" aria-labelledby="title desc">
  <title id="title">Recorded time intervals for the 11 taxa in the Human Origins main path</title>
  <desc id="desc">A data-derived timeline showing the older and younger bounds currently recorded for eleven hominin taxa, from about seven million years ago to the present. Each row includes the catalogue qualitative chronology certainty, not a statistical probability or confidence interval. Time overlap does not imply direct ancestry.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0c2022"/><stop offset="1" stop-color="#071315"/></linearGradient>
    <style>
      text{font-family:Inter,Arial,sans-serif;fill:#eee8dc}
      .title{font-family:"Cormorant Garamond",Georgia,serif;font-size:54px;font-weight:600}
      .subtitle{font-size:19px;fill:#9eaca6}
      .kicker{font-size:15px;font-weight:700;letter-spacing:.14em;fill:#e8bd70}
      .taxon{font-size:20px;font-weight:650}
      .date{font-size:15px;fill:#9eaca6}
      .tick{font-size:14px;fill:#afbbb4}
      .confidence{font-size:13px;font-weight:750;letter-spacing:.06em}
      .grid{stroke:#30494a;stroke-width:1;stroke-dasharray:3 8}
      .rule{stroke:#2b4142;stroke-width:1}
      .note{font-size:16px;fill:#d4d9d1}
      .small{font-size:13px;fill:#9eaca6}
    </style>
  </defs>
  <rect width="1800" height="1120" fill="url(#bg)"/>
  <circle cx="1640" cy="65" r="270" fill="#244343" opacity=".16"/>
  <text x="96" y="95" class="kicker">COMPARATIVE CHRONOLOGY · CLASS A DATA DIAGRAM</text>
  <text x="96" y="158" class="title">Eleven taxa through deep time</text>
  <text x="98" y="198" class="subtitle">Catalogued time intervals · 8 Ma to present · older bounds at left, younger bounds at right</text>
  <line x1="96" y1="222" x2="1700" y2="222" class="rule"/>
  <text x="98" y="252" class="kicker">TAXON / CATALOGUE LABEL</text>
  <text x="360" y="252" class="kicker">TIME (Ma)</text>
<line x1="360" y1="270" x2="360" y2="1002" class="grid"/><text x="360" y="252" class="tick" text-anchor="middle">8 Ma</text>
<line x1="526.875" y1="270" x2="526.875" y2="1002" class="grid"/><text x="526.875" y="252" class="tick" text-anchor="middle">7 Ma</text>
<line x1="693.75" y1="270" x2="693.75" y2="1002" class="grid"/><text x="693.75" y="252" class="tick" text-anchor="middle">6 Ma</text>
<line x1="860.625" y1="270" x2="860.625" y2="1002" class="grid"/><text x="860.625" y="252" class="tick" text-anchor="middle">5 Ma</text>
<line x1="1027.5" y1="270" x2="1027.5" y2="1002" class="grid"/><text x="1027.5" y="252" class="tick" text-anchor="middle">4 Ma</text>
<line x1="1194.375" y1="270" x2="1194.375" y2="1002" class="grid"/><text x="1194.375" y="252" class="tick" text-anchor="middle">3 Ma</text>
<line x1="1361.25" y1="270" x2="1361.25" y2="1002" class="grid"/><text x="1361.25" y="252" class="tick" text-anchor="middle">2 Ma</text>
<line x1="1528.125" y1="270" x2="1528.125" y2="1002" class="grid"/><text x="1528.125" y="252" class="tick" text-anchor="middle">1 Ma</text>
<line x1="1611.5625" y1="270" x2="1611.5625" y2="1002" class="grid"/><text x="1611.5625" y="252" class="tick" text-anchor="middle">500 ka</text>
<line x1="1695" y1="270" x2="1695" y2="1002" class="grid"/><text x="1695" y="252" class="tick" text-anchor="middle">Present</text>
<g data-taxon="sahelanthropus"><text x="98" y="309" class="taxon">Sahelanthropus</text><text x="98" y="332" class="date">~7–6 Ma</text><rect x="526.9" y="295" width="166.9" height="22" rx="8" fill="#d8ad6c" opacity=".9"/><line x1="526.9" y1="290" x2="526.9" y2="322" stroke="#f0e9dd" stroke-width="1.4" opacity=".78"/><line x1="693.8" y1="290" x2="693.8" y2="322" stroke="#f0e9dd" stroke-width="1.4" opacity=".78"/><text x="1530" y="310" class="confidence" fill="#d8ad6c">MEDIUM</text><title>Sahelanthropus: ~7–6 Ma. Qualitative certainty: MEDIUM. Sources: Sahelanthropus tchadensis; TM 266-01-060-1</title></g>
<g data-taxon="orrin"><text x="98" y="375" class="taxon">Orrorin</text><text x="98" y="398" class="date">~6–5.8 Ma</text><rect x="693.8" y="361" width="33.4" height="22" rx="8" fill="#d8ad6c" opacity=".9"/><line x1="693.8" y1="356" x2="693.8" y2="388" stroke="#f0e9dd" stroke-width="1.4" opacity=".78"/><line x1="727.1" y1="356" x2="727.1" y2="388" stroke="#f0e9dd" stroke-width="1.4" opacity=".78"/><text x="1530" y="376" class="confidence" fill="#d8ad6c">MEDIUM</text><title>Orrorin: ~6–5.8 Ma. Qualitative certainty: MEDIUM. Sources: Human Fossils · Species; Orrorin tugenensis</title></g>
<g data-taxon="ardipithecus"><text x="98" y="441" class="taxon">Ardipithecus</text><text x="98" y="464" class="date">~4.5–4.3 Ma</text><rect x="944.1" y="427" width="33.4" height="22" rx="8" fill="#85b8a5" opacity=".9"/><line x1="944.1" y1="422" x2="944.1" y2="454" stroke="#f0e9dd" stroke-width="1.4" opacity=".78"/><line x1="977.4" y1="422" x2="977.4" y2="454" stroke="#f0e9dd" stroke-width="1.4" opacity=".78"/><text x="1530" y="442" class="confidence" fill="#85b8a5">HIGH</text><title>Ardipithecus: ~4.5–4.3 Ma. Qualitative certainty: HIGH. Sources: Human Fossils · Species; Ardipithecus ramidus; Ardipithecus ramidus and the paleobiology of early hominids</title></g>
<g data-taxon="anamensis"><text x="98" y="507" class="taxon">A. anamensis</text><text x="98" y="530" class="date">~4.2–3.8 Ma</text><rect x="994.1" y="493" width="66.8" height="22" rx="8" fill="#85b8a5" opacity=".9"/><line x1="994.1" y1="488" x2="994.1" y2="520" stroke="#f0e9dd" stroke-width="1.4" opacity=".78"/><line x1="1060.9" y1="488" x2="1060.9" y2="520" stroke="#f0e9dd" stroke-width="1.4" opacity=".78"/><text x="1530" y="508" class="confidence" fill="#85b8a5">HIGH</text><title>A. anamensis: ~4.2–3.8 Ma. Qualitative certainty: HIGH. Sources: Australopithecus anamensis; New four-million-year-old hominid species from Kanapoi and Allia Bay, Kenya; A 3.8-million-year-old hominin cranium from Woranso-Mille, Ethiopia</title></g>
<g data-taxon="afarensis"><text x="98" y="573" class="taxon">A. afarensis</text><text x="98" y="596" class="date">~3.9–2.9 Ma</text><rect x="1044.2" y="559" width="166.9" height="22" rx="8" fill="#85b8a5" opacity=".9"/><line x1="1044.2" y1="554" x2="1044.2" y2="586" stroke="#f0e9dd" stroke-width="1.4" opacity=".78"/><line x1="1211.1" y1="554" x2="1211.1" y2="586" stroke="#f0e9dd" stroke-width="1.4" opacity=".78"/><text x="1530" y="574" class="confidence" fill="#85b8a5">HIGH</text><title>A. afarensis: ~3.9–2.9 Ma. Qualitative certainty: HIGH. Sources: Human Fossils · Species; Australopithecus afarensis; Plio-Pleistocene hominid discoveries in Hadar, Ethiopia</title></g>
<g data-taxon="africanus"><text x="98" y="639" class="taxon">A. africanus</text><text x="98" y="662" class="date">~3.3–2.1 Ma</text><rect x="1144.3" y="625" width="200.3" height="22" rx="8" fill="#d8ad6c" opacity=".9"/><line x1="1144.3" y1="620" x2="1144.3" y2="652" stroke="#f0e9dd" stroke-width="1.4" opacity=".78"/><line x1="1344.6" y1="620" x2="1344.6" y2="652" stroke="#f0e9dd" stroke-width="1.4" opacity=".78"/><text x="1530" y="640" class="confidence" fill="#d8ad6c">MEDIUM</text><title>A. africanus: ~3.3–2.1 Ma. Qualitative certainty: MEDIUM. Sources: Human Fossils · Species; Australopithecus africanus; Australopithecus africanus: the man-ape of South Africa</title></g>
<g data-taxon="habilis"><text x="98" y="705" class="taxon">H. habilis</text><text x="98" y="728" class="date">~2.4–1.4 Ma</text><rect x="1294.5" y="691" width="166.9" height="22" rx="8" fill="#d8ad6c" opacity=".9"/><line x1="1294.5" y1="686" x2="1294.5" y2="718" stroke="#f0e9dd" stroke-width="1.4" opacity=".78"/><line x1="1461.4" y1="686" x2="1461.4" y2="718" stroke="#f0e9dd" stroke-width="1.4" opacity=".78"/><text x="1530" y="706" class="confidence" fill="#d8ad6c">MEDIUM</text><title>H. habilis: ~2.4–1.4 Ma. Qualitative certainty: MEDIUM. Sources: Human Fossils · Species; Homo habilis</title></g>
<g data-taxon="erectus"><text x="98" y="771" class="taxon">H. erectus</text><text x="98" y="794" class="date">~1.9 Ma–100 ka</text><rect x="1377.9" y="757" width="300.4" height="22" rx="8" fill="#85b8a5" opacity=".9"/><line x1="1377.9" y1="752" x2="1377.9" y2="784" stroke="#f0e9dd" stroke-width="1.4" opacity=".78"/><line x1="1678.3" y1="752" x2="1678.3" y2="784" stroke="#f0e9dd" stroke-width="1.4" opacity=".78"/><text x="1530" y="772" class="confidence" fill="#85b8a5">HIGH</text><title>H. erectus: ~1.9 Ma–100 ka. Qualitative certainty: HIGH. Sources: Human Fossils · Species; Homo erectus</title></g>
<g data-taxon="heidelbergensis"><text x="98" y="837" class="taxon">H. heidelbergensis</text><text x="98" y="860" class="date">~700–200 ka</text><rect x="1578.2" y="823" width="83.4" height="22" rx="8" fill="#d8ad6c" opacity=".9"/><line x1="1578.2" y1="818" x2="1578.2" y2="850" stroke="#f0e9dd" stroke-width="1.4" opacity=".78"/><line x1="1661.6" y1="818" x2="1661.6" y2="850" stroke="#f0e9dd" stroke-width="1.4" opacity=".78"/><text x="1530" y="838" class="confidence" fill="#d8ad6c">MEDIUM</text><title>H. heidelbergensis: ~700–200 ka. Qualitative certainty: MEDIUM. Sources: Homo sapiens; Homo heidelbergensis</title></g>
<g data-taxon="neanderthal"><text x="98" y="903" class="taxon">Neanderthals</text><text x="98" y="926" class="date">~430–40 ka</text><rect x="1623.2" y="889" width="65.1" height="22" rx="8" fill="#85b8a5" opacity=".9"/><line x1="1623.2" y1="884" x2="1623.2" y2="916" stroke="#f0e9dd" stroke-width="1.4" opacity=".78"/><line x1="1688.3" y1="884" x2="1688.3" y2="916" stroke="#f0e9dd" stroke-width="1.4" opacity=".78"/><text x="1530" y="904" class="confidence" fill="#85b8a5">HIGH</text><title>Neanderthals: ~430–40 ka. Qualitative certainty: HIGH. Sources: Homo neanderthalensis; Ancient DNA and Neanderthals; Feldhofer · Neanderthal 1</title></g>
<g data-taxon="sapiens"><text x="98" y="969" class="taxon">H. sapiens</text><text x="98" y="992" class="date">~315 ka–Present</text><rect x="1642.4" y="955" width="52.6" height="22" rx="8" fill="#85b8a5" opacity=".9"/><line x1="1642.4" y1="950" x2="1642.4" y2="982" stroke="#f0e9dd" stroke-width="1.4" opacity=".78"/><line x1="1695.0" y1="950" x2="1695.0" y2="982" stroke="#f0e9dd" stroke-width="1.4" opacity=".78"/><text x="1530" y="970" class="confidence" fill="#85b8a5">HIGH</text><title>H. sapiens: ~315 ka–Present. Qualitative certainty: HIGH. Sources: Homo sapiens</title></g>
  <line x1="96" y1="1034" x2="1700" y2="1034" class="rule"/>
  <text x="98" y="1064" class="note">Colour = qualitative chronology certainty recorded in the catalogue: high · medium · debated. It is not a probability.</text>
  <text x="98" y="1090" class="small">Bars are the current catalogue interval bounds, not statistical confidence intervals. Overlap is temporal only; it does not establish direct ancestry.</text>
</svg>
