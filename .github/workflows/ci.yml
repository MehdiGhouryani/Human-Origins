name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  release-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      # 18 audits + lint + typecheck + unit tests + next build
      - run: npm run qa:release
      - run: npx playwright install --with-deps chromium
      # Visual baselines are intentionally not a release gate until reviewed snapshots are committed.
      - run: npm run test:e2e -- --grep-invert "visual:"
        env:
          CMS_ADMIN_PASSWORD: ci-only-password
      # Phase 7.1 measurement is informational: keep its result as an artifact for review.
      - name: Measure phase 7.1 performance baseline
        if: github.event_name == 'pull_request'
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts
          npm run start > /tmp/human-origins-next.log 2>&1 &
          server_pid=$!
          cleanup() { kill "$server_pid" 2>/dev/null || true; }
          trap cleanup EXIT
          ready=0
          for attempt in {1..60}; do
            if curl --fail --silent http://127.0.0.1:3000/about >/dev/null; then
              ready=1
              break
            fi
            sleep 2
          done
          if [ "$ready" -ne 1 ]; then
            cat /tmp/human-origins-next.log
            exit 1
          fi
          npm run perf:baseline -- --base http://127.0.0.1:3000 --runs 5 --out artifacts/phase-7-baseline.json
      - name: Upload phase 7.1 performance baseline
        if: always() && github.event_name == 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: phase-7-performance-baseline
          path: artifacts/phase-7-baseline.json
          if-no-files-found: ignore
      # Phase 7.4 CSS spike: capture non-graph computed styles at four widths before changing chunking.
      - name: Capture non-graph CSS fingerprint
        if: github.event_name == 'pull_request'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts
          npm run start > /tmp/human-origins-css.log 2>&1 &
          server_pid=$!
          cleanup() { kill "$server_pid" 2>/dev/null || true; }
          trap cleanup EXIT
          ready=0
          for attempt in {1..60}; do
            if curl --fail --silent http://127.0.0.1:3000/about >/dev/null; then
              ready=1
              break
            fi
            sleep 2
          done
          if [ "$ready" -ne 1 ]; then
            cat /tmp/human-origins-css.log
            exit 1
          fi
          npm run css:fingerprint -- --base http://127.0.0.1:3000 --out artifacts/css-fingerprint.json
      - name: Upload non-graph CSS fingerprint
        if: always() && github.event_name == 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: phase-7-css-fingerprint
          path: artifacts/css-fingerprint.json
          if-no-files-found: ignore
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report
            test-results
