name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  release-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      # 18 audits + lint + typecheck + unit tests + next build
      - run: npm run qa:release
      - run: npx playwright install --with-deps chromium
      # Visual baselines are intentionally not a release gate until reviewed snapshots are committed.
      - run: npm run test:e2e -- --grep-invert "visual:"
        env:
          CMS_ADMIN_PASSWORD: ci-only-password
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report
            test-results
